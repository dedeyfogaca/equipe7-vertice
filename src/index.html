<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Vértice: plataforma para grupos de estudo acompanharem o quanto já avançaram em cada disciplina."
    />
    <meta name="theme-color" content="#07090f" />
    <meta property="og:title" content="Vértice" />
    <meta
      property="og:description"
      content="Veja o quanto você já avançou em cada matéria. Plataforma de acompanhamento de aprendizagem para grupos de estudo."
    />
    <meta property="og:locale" content="pt_BR" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Vértice</title>
    <script>
      // Aplica o tema salvo antes de a página desenhar, para não piscar.
      try {
        if (localStorage.getItem('tema') === 'light') {
          document.documentElement.classList.remove('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f5f7fb');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
