<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Vértice: plataforma para grupos de estudo acompanharem o quanto já avançaram em cada disciplina."
    />
    <meta name="theme-color" content="#07090f" />
    <meta property="og:title" content="Vértice" />
    <meta
      property="og:description"
      content="Veja o quanto você já avançou em cada matéria. Plataforma de acompanhamento de aprendizagem para grupos de estudo."
    />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vértice" />
    <meta property="og:url" content="https://equipe7-vertice.vercel.app/" />
    <!-- Capa da pré-visualização do link (WhatsApp, Instagram, LinkedIn).
         O endereço precisa ser completo: caminho relativo não é lido. -->
    <meta property="og:image" content="https://equipe7-vertice.vercel.app/capa.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vértice: veja o quanto você já avançou em cada matéria." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Vértice</title>
    <script>
      // Aplica o tema salvo antes de a página desenhar, para não piscar.
      try {
        if (localStorage.getItem('tema') === 'light') {
          document.documentElement.classList.remove('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f5f7fb');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
